; PCSX2 settings for the headless test harness (harness/ps2test.py).
; harness/setup-pcsx2.sh merges these into the default ini PCSX2 generates
; (a partial ini on its own leaves PCSX2 waiting in the setup wizard).

[UI]
; Without this, -batch -nogui shows the setup wizard and never boots.
SetupWizardIncomplete = false
ConfirmShutdown = false

[Folders]
Bios = bios

[EmuCore]
; Memory access for the host (harness/ps2test.py talks to it).
EnablePINE = true
PINESlot = 28011

[EmuCore/GS]
; 11 = Null renderer. It still needs a GL context, which comes from llvmpipe.
Renderer = 11

[Logging]
EnableSystemConsole = true
EnableFileLogging = true
EnableTimestamps = true
; The guest's serial output and printf go through these.
EnableEEConsole = true
EnableIOPConsole = true
