# Build every demo (ELF and disc image) with the tinygo-ps2 image, the
# fork's TinyGo on top of the ps2dev toolchain. No emulator here: the
# suite, the visual and the network checks need a BIOS and run locally.
name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/rgsilva/tinygo-ps2:dev
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Toolchain
        run: |
          tinygo version
          go version
      - name: Host tests
        run: go test ./lib/tls13
      - name: Build everything (demos with disc images, tests, controls)
        run: make -j2 all iso fail hang crash panic deadlock gopanic stackoverflow V=1
      # demos.zip: every demo as an ELF and a disc image. tests.zip: the
      # suite, the network test and the harness's controls, for the harness.
      - name: Package
        run: |
          demo_files=""
          for iso in build/*.iso; do demo_files="$demo_files ${iso%.iso}.elf $iso"; done
          python3 -m zipfile -c demos.zip $demo_files
          python3 -m zipfile -c tests.zip build/tests.elf build/net.elf build/fail.elf build/hang.elf build/crash.elf build/panic.elf build/deadlock.elf build/gopanic.elf build/stackoverflow.elf
          python3 -m zipfile -l demos.zip
          python3 -m zipfile -l tests.zip
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ps2go-demos-${{ github.sha }}
          path: |
            demos.zip
            tests.zip
          if-no-files-found: error
      # The image has no GitHub CLI.
      - name: Install the GitHub CLI
        if: github.event_name != 'pull_request'
        run: apk add --no-cache github-cli
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes demos.zip tests.zip
      # The rolling dev-latest pre-release: the last build of main, always at
      # the same address (stale files are removed first).
      - name: Publish the dev release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git push --force origin "$GITHUB_SHA:refs/tags/dev-latest"
          if ! gh release view dev-latest > /dev/null 2>&1; then
            gh release create dev-latest --prerelease --title "Latest build" \
              --notes "Rolling build of main. demos.zip: every demo as an ELF (for ps2link or an emulator) and as a bootable disc image; tests.zip: the test programs for the harness. Replaced on every push."
          fi
          gh release view dev-latest --json assets --jq '.assets[].name' | xargs -r -n1 gh release delete-asset dev-latest --yes
          gh release upload dev-latest demos.zip tests.zip --clobber
